[profile.default]
src = "src"
test = "test"
script = "script"
out = "out"
libs = ["lib"]
solc_version = "0.8.28"
evm_version = "cancun"
optimizer = true
optimizer_runs = 200
ast = true
fs_permissions = [{ access = "read-write", path = "./deployments" }]
remappings = [
  "forge-std/=lib/forge-std/src/",
  "@openzeppelin/contracts/=lib/openzeppelin-contracts/contracts/",
]

[fuzz]
runs = 1000

[invariant]
runs = 128
depth = 64
fail_on_revert = false

[fmt]
line_length = 110

[rpc_endpoints]
robinhood_testnet = "${RPC_URL}"

[lint]
# Public immutable getters (rewardToken(), registry()) are part of the ABI used by the apps.
exclude_lints = ["screaming-snake-case-immutable"]
